<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 250" role="img" aria-label="DNA與RNA檢體處理差異">
  <rect width="980" height="250" fill="#fffdf8"/>
  <text x="490" y="32" text-anchor="middle" font-size="20" fill="#8f2d2c" font-family="Noto Serif TC, serif" font-weight="700">核酸檢體處理：DNA 相對穩定，RNA 極易降解</text>
  <g font-family="Noto Sans TC, sans-serif">
    <rect x="50" y="60" width="420" height="160" rx="16" fill="#e4f1ef"/>
    <text x="260" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#14585c">DNA 病毒核酸</text>
    <text x="260" y="124" text-anchor="middle" font-size="14">處理原則接近真核與細菌 DNA</text>
    <text x="260" y="152" text-anchor="middle" font-size="14">常規無菌與去污染即可</text>
    <text x="260" y="180" text-anchor="middle" font-size="13" fill="#0b3a3c">相對不易被環境酶快速破壞</text>
    <rect x="510" y="60" width="420" height="160" rx="16" fill="#f3e3e0"/>
    <text x="720" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#8f2d2c">病毒 RNA</text>
    <text x="720" y="124" text-anchor="middle" font-size="14">容器須無菌並經 DEPC 處理</text>
    <text x="720" y="152" text-anchor="middle" font-size="14">戴手套：汗液富含 RNAse</text>
    <text x="720" y="180" text-anchor="middle" font-size="13" fill="#8f2d2c">低病毒量時需加 RNAse 抑制劑</text>
  </g>
</svg>
