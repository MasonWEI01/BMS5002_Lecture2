<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" role="img" aria-label="PCR三步驟循環">
  <rect width="980" height="360" fill="#fffdf8"/>
  <text x="490" y="34" text-anchor="middle" font-size="20" fill="#8f2d2c" font-family="Noto Serif TC, serif" font-weight="700">PCR 熱循環三步驟</text>
  <g font-family="Noto Sans TC, sans-serif">
    <rect x="40" y="70" width="280" height="230" rx="16" fill="#f3e3e0"/>
    <text x="180" y="104" text-anchor="middle" font-size="18" fill="#8f2d2c" font-weight="700">1. 變性 Denaturation</text>
    <text x="180" y="132" text-anchor="middle" font-size="13" fill="#8f2d2c">約 94–98°C</text>
    <line x1="90" y1="180" x2="270" y2="180" stroke="#8f2d2c" stroke-width="3"/>
    <line x1="90" y1="200" x2="270" y2="200" stroke="#14585c" stroke-width="3"/>
    <text x="180" y="246" text-anchor="middle" font-size="13" fill="#1c2b2d">雙股 DNA 拆成單股</text>
    <text x="180" y="270" text-anchor="middle" font-size="13" fill="#1c2b2d">模板露出鹼基序列</text>

    <rect x="350" y="70" width="280" height="230" rx="16" fill="#e4f1ef"/>
    <text x="490" y="104" text-anchor="middle" font-size="18" fill="#14585c" font-weight="700">2. 退火 Annealing</text>
    <text x="490" y="132" text-anchor="middle" font-size="13" fill="#14585c">約 50–65°C</text>
    <line x1="400" y1="176" x2="580" y2="176" stroke="#8f2d2c" stroke-width="3"/>
    <rect x="418" y="170" width="46" height="12" fill="#b8893a"/>
    <line x1="400" y1="214" x2="580" y2="214" stroke="#14585c" stroke-width="3"/>
    <rect x="516" y="208" width="46" height="12" fill="#b8893a"/>
    <text x="490" y="256" text-anchor="middle" font-size="13" fill="#1c2b2d">引子與互補序列結合</text>
    <text x="490" y="280" text-anchor="middle" font-size="13" fill="#1c2b2d">決定擴增的特異性</text>

    <rect x="660" y="70" width="280" height="230" rx="16" fill="#f6ead0"/>
    <text x="800" y="104" text-anchor="middle" font-size="18" fill="#9a6b1f" font-weight="700">3. 延伸 Extension</text>
    <text x="800" y="132" text-anchor="middle" font-size="13" fill="#9a6b1f">約 72°C</text>
    <line x1="710" y1="176" x2="890" y2="176" stroke="#8f2d2c" stroke-width="3"/>
    <line x1="728" y1="188" x2="870" y2="188" stroke="#b8893a" stroke-width="6"/>
    <line x1="710" y1="220" x2="890" y2="220" stroke="#14585c" stroke-width="3"/>
    <line x1="728" y1="208" x2="870" y2="208" stroke="#b8893a" stroke-width="6"/>
    <text x="800" y="256" text-anchor="middle" font-size="13" fill="#1c2b2d">DNA 聚合酶合成新股</text>
    <text x="800" y="280" text-anchor="middle" font-size="13" fill="#1c2b2d">每循環約使拷貝數倍增</text>
  </g>
</svg>
