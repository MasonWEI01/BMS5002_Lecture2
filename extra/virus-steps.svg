<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 280" role="img" aria-label="病毒感染細胞四步驟">
  <rect width="980" height="280" fill="#fffdf8"/>
  <text x="490" y="32" text-anchor="middle" font-size="20" fill="#8f2d2c" font-family="Noto Serif TC, serif" font-weight="700">病毒如何劫持宿主細胞</text>
  <g font-family="Noto Sans TC, sans-serif" font-size="14">
    <circle cx="120" cy="120" r="46" fill="#14585c"/>
    <text x="120" y="126" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">1</text>
    <text x="120" y="190" text-anchor="middle" fill="#0b3a3c">進入細胞</text>
    <text x="120" y="212" text-anchor="middle" font-size="12" fill="#3d5254">釋出核酸</text>
    <path d="M176 120 H250" stroke="#b8893a" stroke-width="4" marker-end="url(#a)"/>
    <circle cx="320" cy="120" r="46" fill="#1e7a76"/>
    <text x="320" y="126" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">2</text>
    <text x="320" y="190" text-anchor="middle" fill="#0b3a3c">接管細胞核／合成系統</text>
    <text x="320" y="212" text-anchor="middle" font-size="12" fill="#3d5254">RNA 或 DNA 被複製</text>
    <path d="M376 120 H450" stroke="#b8893a" stroke-width="4"/>
    <circle cx="520" cy="120" r="46" fill="#b8893a"/>
    <text x="520" y="126" text-anchor="middle" fill="#0b3a3c" font-size="20" font-weight="700">3</text>
    <text x="520" y="190" text-anchor="middle" fill="#0b3a3c">組裝新病毒顆粒</text>
    <text x="520" y="212" text-anchor="middle" font-size="12" fill="#3d5254">核酸＋蛋白質外殼</text>
    <path d="M576 120 H650" stroke="#b8893a" stroke-width="4"/>
    <circle cx="720" cy="120" r="46" fill="#8f2d2c"/>
    <text x="720" y="126" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">4</text>
    <text x="720" y="190" text-anchor="middle" fill="#0b3a3c">釋出並破壞細胞</text>
    <text x="720" y="212" text-anchor="middle" font-size="12" fill="#3d5254">傳染病於是發生</text>
    <text x="860" y="126" text-anchor="middle" font-size="13" fill="#8f2d2c">細胞嚴重損傷</text>
  </g>
</svg>
