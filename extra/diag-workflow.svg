<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-label="傳染病診斷路徑比較">
  <rect width="980" height="420" fill="#fffdf8"/>
  <text x="490" y="36" text-anchor="middle" font-size="20" fill="#8f2d2c" font-family="Noto Serif TC, serif" font-weight="700">傳染病實驗室診斷兩條主路徑</text>
  <rect x="40" y="70" width="420" height="320" rx="18" fill="#e4f1ef" stroke="#14585c"/>
  <rect x="520" y="70" width="420" height="320" rx="18" fill="#f6ead0" stroke="#b8893a"/>
  <text x="250" y="104" text-anchor="middle" font-size="16" fill="#0b3a3c" font-weight="700" font-family="Noto Sans TC, sans-serif">傳統路徑（培養為核心）</text>
  <text x="730" y="104" text-anchor="middle" font-size="16" fill="#8f2d2c" font-weight="700" font-family="Noto Sans TC, sans-serif">分子路徑（核酸／抗原為核心）</text>
  <g font-family="Noto Sans TC, sans-serif" font-size="14" fill="#1c2b2d">
    <rect x="90" y="128" width="320" height="38" rx="8" fill="#fff"/><text x="250" y="153" text-anchor="middle">1. 分離病原體</text>
    <rect x="90" y="182" width="320" height="38" rx="8" fill="#fff"/><text x="250" y="207" text-anchor="middle">2. 培養增殖</text>
    <rect x="90" y="236" width="320" height="38" rx="8" fill="#fff"/><text x="250" y="261" text-anchor="middle">3. 顯微鏡／電子顯微鏡觀察</text>
    <rect x="90" y="290" width="320" height="38" rx="8" fill="#fff"/><text x="250" y="315" text-anchor="middle">4. 表型鑑定與藥敏</text>
    <text x="250" y="362" text-anchor="middle" font-size="12" fill="#8f2d2c">限制：耗時、部分病原無法培養</text>
    <rect x="570" y="128" width="320" height="38" rx="8" fill="#fff"/><text x="730" y="153" text-anchor="middle">1. 嚴謹採集與核酸製備</text>
    <rect x="570" y="182" width="320" height="38" rx="8" fill="#fff"/><text x="730" y="207" text-anchor="middle">2. 雜交／PCR／qPCR</text>
    <rect x="570" y="236" width="320" height="38" rx="8" fill="#fff"/><text x="730" y="261" text-anchor="middle">3. 抗原 ELISA／螢光抗體</text>
    <rect x="570" y="290" width="320" height="38" rx="8" fill="#fff"/><text x="730" y="315" text-anchor="middle">4. 病毒量與抗藥基因型</text>
    <text x="730" y="362" text-anchor="middle" font-size="12" fill="#14585c">優勢：快速、高敏感、可定量</text>
  </g>
</svg>
